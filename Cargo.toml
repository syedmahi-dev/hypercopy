[package]
name = "hypercopy"
version = "0.1.0"
edition = "2024"
authors = ["HyperCopy Team"]
description = "The world's fastest bare-metal hardware-saturating copy & paste CLI engine written in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
rayon = "1.10"
crossbeam-channel = "0.5"
mimalloc = { version = "0.1", default-features = false }
blake3 = { version = "1.5", features = ["rayon", "mmap"] }
colored = "2.1"
walkdir = "2.5"
memmap2 = "0.9"
num_cpus = "1.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
